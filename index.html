<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Games!!!</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* FULL PRANK SCREEN */
#warningOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999999;
  animation: flash 0.2s infinite;
}

/* BIG TEXT */
#warningText {
  color: white;
  font-size: 70px;
  font-family: Impact, Arial Black, sans-serif;
  text-align: center;
  text-shadow: 0 0 20px black;
  animation: shake 0.1s infinite;
}

/* CLICK TO START (needed for sound) */
#clickToStart {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  z-index: 1000000;
  cursor: pointer;
  text-align: center;
  padding: 20px;
}

/* ANIMATIONS */
@keyframes flash {
  0% { background: rgba(255,0,0,0.95); }
  50% { background: rgba(120,0,0,0.95); }
  100% { background: rgba(255,0,0,0.95); }
}

@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(3px,-3px); }
  50% { transform: translate(-3px,3px); }
  75% { transform: translate(3px,3px); }
  100% { transform: translate(-3px,-3px); }
}
</style>

</head>

<body>

<!-- PRANK SCREEN (ONLY THING VISIBLE) -->
<div id="warningOverlay">
  <div id="warningText">WHY ARE YOU HERE!!!</div>
</div>

<!-- CLICK TO ENABLE SOUND -->
<div id="clickToStart">
  🔊 CLICK ANYWHERE TO START
</div>

<!-- SOUND -->
<audio id="sirenAudio" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/siren_whistle.ogg">
</audio>

<script>
const clickScreen = document.getElementById("clickToStart");
const audio = document.getElementById("sirenAudio");

clickScreen.addEventListener("click", () => {

  // hide click screen
  clickScreen.style.display = "none";

  // set volume + play sound
  audio.volume = 1;

  audio.play().catch(err => {
    console.log("Audio blocked:", err);
  });

  // optional: make it more intense after start
  document.title = "Fun Games!!!";
});
</script>

</body>
</html>
