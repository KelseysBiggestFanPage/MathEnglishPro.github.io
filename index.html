<!-- PRANK MODE -->
<style>
#loadingBanner{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-family:Arial,sans-serif;
    z-index:999998;
    animation:pulseBanner 1s infinite;
}

@keyframes pulseBanner{
    0%{background:#111;}
    50%{background:#333;}
    100%{background:#111;}
}

#warningOverlay {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,0.9);
    z-index: 999999;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: flashRed 0.2s infinite;
}

#warningText {
    color: white;
    font-size: 70px;
    font-family: Impact, Arial Black, sans-serif;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 20px black;
    animation: shakeText 0.1s infinite;
    padding:20px;
}

@keyframes flashRed {
    0% { background: rgba(255,0,0,0.95); }
    50% { background: rgba(80,0,0,0.95); }
    100% { background: rgba(255,0,0,0.95); }
}

@keyframes shakeText {
    0% { transform: translate(0px,0px); }
    25% { transform: translate(3px,-3px); }
    50% { transform: translate(-3px,3px); }
    75% { transform: translate(3px,3px); }
    100% { transform: translate(-3px,-3px); }
}
</style>

<div id="loadingBanner">
    PLEASE WAIT WHILE THE GAMES LOAD!
</div>

<div id="warningOverlay">
    <div id="warningText">
        WHY ARE YOU HERE!!!
    </div>
</div>

<audio id="sirenAudio" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/siren_whistle.ogg" type="audio/ogg">
</audio>

<script>

// after 15 seconds
setTimeout(() => {

    // change tab title
    document.title = "Fun Games!!!";

    // hide loading banner
    document.getElementById("loadingBanner").style.display = "none";

    // show flashing overlay
    document.getElementById("warningOverlay").style.display = "flex";

    // play siren
    const siren = document.getElementById("sirenAudio");

    siren.volume = 1.0;

    siren.play().catch(() => {
        console.log("Autoplay blocked until interaction.");
    });

}, 15000);

</script>
