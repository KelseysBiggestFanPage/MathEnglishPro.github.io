<!DOCTYPE html>
<html lang="en-US">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading...</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #warningOverlay {
            position: fixed;
            inset: 0;
            background: rgba(255,0,0,0.95);
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: flashRed 0.2s infinite;
        }

        #warningText {
            color: white;
            font-size: 70px;
            font-family: Impact, Arial Black, sans-serif;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 20px black;
            animation: shakeText 0.1s infinite;
            padding: 20px;
        }

        @keyframes flashRed {
            0% { background: rgba(255,0,0,0.95); }
            50% { background: rgba(80,0,0,0.95); }
            100% { background: rgba(255,0,0,0.95); }
        }

        @keyframes shakeText {
            0% { transform: translate(0px,0px); }
            25% { transform: translate(-3px,3px); }
            50% { transform: translate(3px,-3px); }
            75% { transform: translate(3px,3px); }
            100% { transform: translate(-3px,-3px); }
        }
    </style>

</head>

<body>

<div id="warningOverlay">
    <div id="warningText">WHY ARE YOU HERE!!!</div>
</div>

<!-- SOUND (YOUR GITHUB FILE) -->
<audio id="roarAudio" loop>
    <source src="t-rex-roar.mp3" type="audio/mp3">
</audio>

<script>
window.addEventListener("load", () => {

    document.title = "Fun Games!!!";

    const roar = document.getElementById("roarAudio");

    // MAX VOLUME + LOOP FOREVER
    roar.volume = 1.0;
    roar.loop = true;

    // Try autoplay instantly
    const playPromise = roar.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            // If blocked, start on first click
            document.body.addEventListener("click", () => {
                roar.play();
            }, { once: true });
        });
    }

});
</script>

</body>
</html>
